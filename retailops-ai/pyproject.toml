[project]
name = "retailops-ai"
version = "0.1.0"
description = "LangGraph multi-agent layer that reasons over StockPilot's HTTP API."
requires-python = "==3.11.*"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.16.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
