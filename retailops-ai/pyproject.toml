[project]
name = "retailops-ai"
version = "0.1.0"
description = "LangGraph multi-agent layer that reasons over StockPilot's HTTP API."
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.140.8",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "python-dotenv==1.2.2",
    "httpx2==2.9.1",
    "httpx==0.28.1",
    "email-validator==2.3.0",
    "langchain-core==1.5.2",
    "langgraph==1.2.10",
    "google-genai==2.14.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "datamodel-code-generator==0.71.0",
    "types-PyYAML==6.0.12.20260724",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
