# Role -> provider + model. No model name may appear anywhere else in
# the codebase (CLAUDE.md section 7); code asks for a role, never a
# literal model string. Stage 6 Task 6.4 added `fallback`: the ONE
# provider+model tried, for ANY role, when a role's own primary
# provider raises a failover-eligible error (llm/providers/fallback.py).
# Stage 6 Task 6.5 swapped which provider occupies which slot -- see
# docs/adr/007-multi-provider-fallback.md for the full reasoning; this
# is a deployment/config decision (quota availability), not an
# architecture change. The provider abstraction is symmetric by
# design, so nothing about llm/providers/ itself changed for this.
#
# roles.*.model verified against Groq's real model-list endpoint during
# Task 6.5's implementation. All three roles share ONE model
# (openai/gpt-oss-120b), not per-role choices, for the same reason
# Task 6.4 picked it as the single fallback model: it's the only model
# on this account confirmed to reliably handle every call shape this
# codebase needs (tool calls, response_format=json_schema, streaming,
# and -- specifically -- tool_choice="none" adherence against
# prompts/planner/v1.md's real text; the smaller openai/gpt-oss-20b and
# -safeguard-20b variants unreliably attempted a phantom tool call
# against that exact prompt even with tool_choice explicitly set, see
# Task 6.4's own findings, still the reason those two remain
# unconfigured for any role).
#
# fallback.model verified LIVE against Gemini's real model-list
# endpoint during Task 6.5's implementation, with ONE constraint beyond
# "the ID exists": this account's `gemini-3.1-pro-preview` quota has
# been observed hard-zero all build (every live test since Stage 3
# Task 3.1 confirms `429 RESOURCE_EXHAUSTED` with `limit: 0`) -- using
# it as the single fallback model would make failover to Gemini
# structurally incapable of ever actually succeeding, silently
# defeating the whole point of having a fallback. `gemini-3.5-flash`
# has real (if modest, rate-limited) usable quota on this account and
# was the model that already served the retriever role successfully
# throughout Stages 3-6, so it is the fallback model for ALL THREE
# roles here, not just retriever's own prior role.
#
# Re-run the relevant verification script after editing either section,
# and before ever pointing an agent at a new ID.
roles:
  planner:
    provider: groq
    model: openai/gpt-oss-120b # strongest reasoning available on this account; planning and replanning
  retriever:
    provider: groq
    model: openai/gpt-oss-120b # fast, cheap; inventory / forecast / analytics agents
  decision:
    provider: groq
    model: openai/gpt-oss-120b # Decision Engine prose only

fallback:
  provider: gemini
  model: gemini-3.5-flash # verified live: tool calls, structured output, streaming, and REAL usable
  # quota on this account -- gemini-3.1-pro-preview's quota is hard-zero, see comment above

budgets:
  max_tool_iterations: 12
  max_tokens_per_execution: 60000
