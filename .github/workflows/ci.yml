name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [stockpilot-core, retailops-ai]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ${{ matrix.service }}/pyproject.toml

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: pip install -e ".[dev]"

      - name: Ruff check
        working-directory: ${{ matrix.service }}
        run: ruff check .

      - name: Ruff format check
        working-directory: ${{ matrix.service }}
        run: ruff format --check .

      - name: mypy
        working-directory: ${{ matrix.service }}
        run: mypy --config-file pyproject.toml .

      - name: pytest
        working-directory: ${{ matrix.service }}
        run: pytest tests
