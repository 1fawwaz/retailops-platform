name: Render Keep-Alive

# Pings both Render services every 10 minutes to prevent free-tier cold starts.
# Render free services spin down after 15 minutes of inactivity; this cron
# fires every 10 minutes, keeping them warm.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # allows manual trigger from the GitHub Actions UI

jobs:
  keepalive:
    name: Ping Render services
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping StockPilot Core (/health)
        run: |
          echo "Pinging https://retail-hta8.onrender.com/health"
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --max-time 30 --retry 2 --retry-delay 5 \
            https://retail-hta8.onrender.com/health)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::StockPilot Core health check failed (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "StockPilot Core is healthy (HTTP $HTTP_STATUS)"

      - name: Ping RetailOps AI (/health)
        run: |
          echo "Pinging https://retailops-ai.onrender.com/health"
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --max-time 30 --retry 2 --retry-delay 5 \
            https://retailops-ai.onrender.com/health)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::warning::RetailOps AI health check returned HTTP $HTTP_STATUS (service may be deploying)"
          else
            echo "RetailOps AI is healthy (HTTP $HTTP_STATUS)"
          fi
