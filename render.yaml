services:
  - type: web
    name: stockpilot-core
    env: docker
    dockerfilePath: ./stockpilot-core/Dockerfile
    dockerContext: ./stockpilot-core
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: DEMO_USER_EMAIL
        value: demo@retailops.local
      - key: DEMO_USER_PASSWORD
        value: _awv1jRthdu2YNJzao9CyA
      - key: CORS_ALLOWED_ORIGINS
        value: https://stockpilot-frontend-zeta.vercel.app,https://retailops-ai-frontend.vercel.app

  - type: web
    name: retailops-ai
    env: docker
    dockerfilePath: ./retailops-ai/Dockerfile
    dockerContext: ./retailops-ai
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: RETAILOPS_DATABASE_URL
        sync: false
      - key: STOCKPILOT_BASE_URL
        fromService:
          type: web
          name: stockpilot-core
          property: hostport
      - key: JWT_SECRET
        fromService:
          type: web
          name: stockpilot-core
          property: envVar:JWT_SECRET
      - key: JWT_ALGORITHM
        value: HS256
      - key: STOCKPILOT_USERNAME
        value: demo@retailops.local
      - key: STOCKPILOT_PASSWORD
        value: _awv1jRthdu2YNJzao9CyA
      - key: GROQ_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: LLM_PRIMARY_PROVIDER
        value: gemini
