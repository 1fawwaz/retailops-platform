services:
  # ── StockPilot Core (FastAPI + Postgres) ─────────────────────────────────────
  # Build context = repo root (retailops-platform/).
  # Dockerfile lives at stockpilot-core/Dockerfile inside that context.
  - type: web
    name: stockpilot-core
    env: docker
    # Render resolves dockerfilePath relative to the repo root
    dockerfilePath: ./stockpilot-core/Dockerfile
    # The build context is the repo root so COPY stockpilot-core/ works
    dockerContext: .
    plan: free
    region: virginia
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: DEMO_USER_EMAIL
        value: demo@retailops.local
      - key: DEMO_USER_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://stockpilot-frontend-zeta.vercel.app,https://retailops-ai-frontend.vercel.app,https://retailops-ai.onrender.com"

  # ── RetailOps AI (LangGraph + Postgres) ─────────────────────────────────────
  - type: web
    name: retailops-ai
    env: docker
    dockerfilePath: ./retailops-ai/Dockerfile
    dockerContext: .
    plan: free
    region: virginia
    healthCheckPath: /health
    envVars:
      - key: RETAILOPS_DATABASE_URL
        sync: false
      - key: STOCKPILOT_BASE_URL
        value: "https://retail-hta8.onrender.com"
      - key: JWT_SECRET
        fromService:
          type: web
          name: stockpilot-core
          property: envVar:JWT_SECRET
      - key: JWT_ALGORITHM
        value: HS256
      - key: STOCKPILOT_USERNAME
        value: admin@retailops.local
      - key: STOCKPILOT_PASSWORD
        sync: false
      - key: GROQ_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: LLM_PRIMARY_PROVIDER
        value: gemini
      - key: CORS_ALLOWED_ORIGINS
        value: "https://stockpilot-frontend-zeta.vercel.app,https://retailops-ai-frontend.vercel.app"
