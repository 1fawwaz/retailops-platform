services:
  db-stockpilot:
    image: postgres:16
    env_file:
      - stockpilot-core/.env
    ports:
      - "5434:5432"
    volumes:
      - stockpilot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-retailops:
    image: postgres:16
    env_file:
      - retailops-ai/.env
    ports:
      - "5433:5432"
    volumes:
      - retailops-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stockpilot-db-data:
  retailops-db-data:
