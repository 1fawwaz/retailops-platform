repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(stockpilot-core|retailops-ai)/
      - id: ruff-format
        files: ^(stockpilot-core|retailops-ai)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        name: mypy (stockpilot-core)
        files: ^stockpilot-core/
        args: [--config-file=stockpilot-core/pyproject.toml]
        additional_dependencies:
          - sqlalchemy==2.0.51
          - alembic==1.18.5
          - psycopg[binary]==3.3.4
          - python-dotenv==1.2.2
          - pandas==3.0.5
          - numpy==2.4.6
          - openpyxl==3.1.5
          - pytest==9.1.1
      - id: mypy
        name: mypy (retailops-ai)
        files: ^retailops-ai/
        args: [--config-file=retailops-ai/pyproject.toml]
        additional_dependencies:
          - sqlalchemy==2.0.51
          - alembic==1.18.5
          - psycopg[binary]==3.3.4
          - python-dotenv==1.2.2
