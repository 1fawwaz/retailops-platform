repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(stockpilot-core|retailops-ai)/
      - id: ruff-format
        files: ^(stockpilot-core|retailops-ai)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        name: mypy (stockpilot-core)
        files: ^stockpilot-core/
        args: [--config-file=stockpilot-core/pyproject.toml]
        additional_dependencies:
          - fastapi==0.140.8
          - uvicorn[standard]==0.51.0
          - pydantic==2.13.4
          - sqlalchemy==2.0.51
          - alembic==1.18.5
          - psycopg[binary]==3.3.4
          - python-dotenv==1.2.2
          - pandas==3.0.5
          - numpy==2.4.6
          - openpyxl==3.1.5
          - pytest==9.1.1
          - httpx2==2.9.1
          - pydantic-settings==2.14.2
          - bcrypt==5.0.0
          - pyjwt==2.13.0
          - python-multipart==0.0.32
          - email-validator==2.3.0
          - pandas-stubs==3.0.3.260530
          - scikit-learn==1.9.0
      - id: mypy
        name: mypy (retailops-ai)
        files: ^retailops-ai/
        args: [--config-file=retailops-ai/pyproject.toml]
        additional_dependencies:
          - fastapi==0.140.8
          - uvicorn[standard]==0.51.0
          - pydantic==2.13.4
          - pydantic-settings==2.14.2
          - sqlalchemy==2.0.51
          - alembic==1.18.5
          - psycopg[binary]==3.3.4
          - python-dotenv==1.2.2
          - pytest==9.1.1
          - httpx2==2.9.1
          - httpx==0.28.1
          - email-validator==2.3.0
          - langchain-core==1.5.2
          - langgraph==1.2.10
          - google-genai==2.14.0
          - pyyaml==6.0.3
          - types-PyYAML==6.0.12.20260724
